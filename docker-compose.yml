services:
  postgres:
    image: postgres:17-alpine
    container_name: doc-updater-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_updater
      POSTGRES_USER: doc_updater
      POSTGRES_PASSWORD: doc_updater
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_updater -d doc_updater"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
